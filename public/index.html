<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>動画サーバー</title>
    <style>
      :root {
        --bg: #1a1a1e;
        --surface: #252530;
        --text: #e8e8ed;
        --muted: #8b8b9a;
        --accent: #7c9cff;
        --accent-hover: #9ab0ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          'SF Pro Text',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .layout {
        display: grid;
        grid-template-columns: 320px 4px 1fr;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }
      header {
        grid-column: 1 / -1;
        padding: 1rem 1.5rem;
        background: var(--surface);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        font-weight: 600;
        font-size: 1.1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      aside {
        overflow-y: auto;
        padding: 0.75rem 0;
      }
      main {
        padding: 1.5rem;
        overflow: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .resizer {
        background: rgba(255, 255, 255, 0.06);
        cursor: col-resize;
        transition: background 0.2s;
      }
      .resizer:hover,
      .resizer.active {
        background: var(--accent);
      }
      .video-tree {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 0.9rem;
      }
      .video-tree ul {
        list-style: none;
        margin: 0;
        padding: 0;
        padding-left: 1rem;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        margin-left: 0.5rem;
      }
      .video-tree .tree-folder {
        padding: 0.35rem 0.5rem;
        cursor: pointer;
        border-radius: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .video-tree .tree-folder:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .video-tree .tree-folder .arrow {
        font-size: 0.65rem;
        color: var(--muted);
        transition: transform 0.15s ease;
      }
      .video-tree .tree-folder.collapsed .arrow {
        transform: rotate(-90deg);
      }
      .video-tree .tree-folder.collapsed + ul {
        display: none;
      }
      .video-tree .tree-file {
        padding: 0.35rem 0.5rem 0.35rem 1.25rem;
        cursor: pointer;
        border-radius: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .tree-file .file-label,
      .fav-item .file-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .open-tab-icon {
        opacity: 0;
        margin-left: 0.5rem;
        padding: 0.1rem 0.35rem;
        border-radius: 4px;
        font-size: 0.75rem;
        color: var(--muted);
        transition: opacity 0.15s, color 0.15s, background 0.15s;
        cursor: pointer;
        flex-shrink: 0;
      }
      .tree-file:hover .open-tab-icon,
      .fav-item:hover .open-tab-icon {
        opacity: 1;
      }
      .open-tab-icon:hover {
        background: rgba(255, 255, 255, 0.15);
        color: var(--text);
      }
      .video-tree .tree-file:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .video-tree .tree-file.active {
        background: rgba(124, 156, 255, 0.2);
        color: var(--accent);
      }
      .player-wrap {
        width: 100%;
        max-width: 960px;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      .player-wrap video {
        width: 100%;
        display: block;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 3rem 1rem;
      }
      .loading {
        color: var(--muted);
        padding: 1rem;
      }
      .error {
        color: #f87171;
        padding: 1rem;
      }
      .player-wrap.large {
        max-width: 1920px;
      }
      .controls {
        margin-top: 1rem;
        display: flex;
        gap: 1rem;
      }
      .btn {
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text);
        padding: 0.5rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      #favSection {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: 0.5rem;
        margin-bottom: 0.25rem;
      }
      .fav-header {
        padding: 0.5rem 0.75rem 0.25rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      .fav-item {
        padding: 0.35rem 0.5rem 0.35rem 1.25rem;
        cursor: pointer;
        border-radius: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 0.9rem;
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .fav-item:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .fav-item.active {
        background: rgba(124, 156, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <header>
        <span>動画サーバー</span>
        <button class="btn" id="selectFolderBtn">📂 フォルダを選択</button>
      </header>
      <aside>
        <div id="favSection" style="display:none">
          <div class="fav-header">★ お気に入り</div>
          <ul id="favList" class="video-tree"></ul>
        </div>
        <ul class="video-tree" id="videoTree"></ul>
        <p class="loading" id="listStatus">読み込み中…</p>
      </aside>
      <div class="resizer" id="resizer"></div>
      <main>
        <div class="player-wrap" id="playerWrap" style="display: none">
          <video
            id="video"
            controls
            muted
            preload="metadata"
            crossorigin="anonymous"
          ></video>
        </div>
        <div class="controls" id="videoControls" style="display: none">
          <button class="btn" id="rewind30Btn">⏪ 60秒</button>
          <button class="btn" id="rewind10Btn">⏪ 30秒</button>
          <button class="btn" id="forward10Btn">30秒 ⏩</button>
          <button class="btn" id="forward30Btn">60秒 ⏩</button>
          <button class="btn" id="favBtn">☆ お気に入り</button>
          <button class="btn" id="sizeToggle">サイズ2倍</button>
          <button class="btn" id="openNewTabBtn" title="別タブで開く">↗ 別タブで開く</button>
        </div>
        <p class="empty" id="emptyMsg">左の一覧から動画を選んでください</p>
      </main>
    </div>

    <script>
      const VIDEO_KEY = 'video-server-current';
      const TIME_KEY = 'video-server-time';
      const FAVORITES_KEY = 'video-server-favorites';

      function getFavorites() {
        try {
          return JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]');
        } catch (e) { return []; }
      }

      function saveFavorites(arr) {
        try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(arr)); } catch (e) {}
      }

      function isFavorite(path) {
        return getFavorites().includes(path);
      }

      function toggleFavorite(path) {
        const favs = getFavorites();
        const idx = favs.indexOf(path);
        if (idx === -1) { favs.push(path); } else { favs.splice(idx, 1); }
        saveFavorites(favs);
      }

      const videoTreeEl = document.getElementById('videoTree');
      const listStatusEl = document.getElementById('listStatus');
      const playerWrap = document.getElementById('playerWrap');
      const videoControls = document.getElementById('videoControls');
      const rewind30Btn = document.getElementById('rewind30Btn');
      const rewind10Btn = document.getElementById('rewind10Btn');
      const forward10Btn = document.getElementById('forward10Btn');
      const forward30Btn = document.getElementById('forward30Btn');
      const sizeToggle = document.getElementById('sizeToggle');
      const openNewTabBtn = document.getElementById('openNewTabBtn');
      const emptyMsg = document.getElementById('emptyMsg');
      const video = document.getElementById('video');
      const resizer = document.getElementById('resizer');
      const layout = document.querySelector('.layout');
      const selectFolderBtn = document.getElementById('selectFolderBtn');
      const favBtn = document.getElementById('favBtn');
      const favSection = document.getElementById('favSection');
      const favList = document.getElementById('favList');

      let videoList = [];
      let currentPath = null;
      let lastTree = [];

      function showPlayer(show) {
        playerWrap.style.display = show ? 'block' : 'none';
        videoControls.style.display = show ? 'flex' : 'none';
        emptyMsg.style.display = show ? 'none' : 'block';
      }

      function setActiveItem(relativePath) {
        videoTreeEl.querySelectorAll('.tree-file').forEach((el) => {
          el.classList.toggle('active', el.dataset.path === relativePath);
        });
        favList.querySelectorAll('.fav-item').forEach((el) => {
          el.classList.toggle('active', el.dataset.path === relativePath);
        });
      }

      function playVideo(relativePath) {
        currentPath = relativePath;
        const url = '/video?path=' + encodeURIComponent(relativePath);
        video.src = url;
        video.load();

        const saved = getSavedState();
        if (saved && saved.path === relativePath && saved.time > 0) {
          video.currentTime = saved.time;
        } else {
          video.currentTime = 0;
        }

        video.play().catch(() => {});
        showPlayer(true);
        updateFavBtn(relativePath);
        setActiveItem(relativePath);
        saveState(relativePath, video.currentTime);
      }

      function getSavedState() {
        try {
          const raw = localStorage.getItem(VIDEO_KEY);
          const time = localStorage.getItem(TIME_KEY);
          if (raw && time !== null)
            return { path: raw, time: parseFloat(time) || 0 };
        } catch (e) {}
        return null;
      }

      function saveState(path, time) {
        try {
          localStorage.setItem(VIDEO_KEY, path);
          localStorage.setItem(TIME_KEY, String(time >= 0 ? time : 0));
        } catch (e) {}
      }

      video.addEventListener('timeupdate', () => {
        const el = videoTreeEl.querySelector('.tree-file.active');
        const rel = el ? el.dataset.path : null;
        if (rel) saveState(rel, video.currentTime);
      });

      video.addEventListener('ended', () => {
        const el = videoTreeEl.querySelector('.tree-file.active');
        const rel = el ? el.dataset.path : null;
        if (rel) saveState(rel, 0);
      });

      sizeToggle.addEventListener('click', () => {
        playerWrap.classList.toggle('large');
        const isLarge = playerWrap.classList.contains('large');
        sizeToggle.textContent = isLarge ? 'サイズ標準' : 'サイズ2倍';
      });

      openNewTabBtn.addEventListener('click', () => {
        openInNewTab(currentPath);
      });

      favBtn.addEventListener('click', () => {
        if (!currentPath) return;
        toggleFavorite(currentPath);
        updateFavBtn(currentPath);
        refreshTreeStars();
        renderFavSection();
      });

      rewind30Btn.addEventListener('click', () => {
        video.currentTime = Math.max(0, video.currentTime - 60);
      });
      rewind10Btn.addEventListener('click', () => {
        video.currentTime = Math.max(0, video.currentTime - 30);
      });
      forward10Btn.addEventListener('click', () => {
        video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 30);
      });
      forward30Btn.addEventListener('click', () => {
        video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 60);
      });

      function flattenTree(nodes) {
        const out = [];
        function walk(arr) {
          for (const n of arr) {
            if (n.type === 'file') out.push(n.path);
            if (n.type === 'folder' && n.children) walk(n.children);
          }
        }
        walk(nodes);
        return out;
      }

      function renderTree(nodes) {
        let html = '';
        for (const n of nodes) {
          if (n.type === 'folder') {
            const hasChildren = n.children && n.children.length > 0;
            const collapsedClass = hasChildren ? ' collapsed' : '';
            html += `<div class="tree-folder${collapsedClass}" ${hasChildren ? '' : 'style="opacity:.7"'}>`;
            html += hasChildren
              ? '<span class="arrow">▼</span>'
              : '<span class="arrow">・</span>';
            html += escapeHtml(n.name) + '</div>';
            if (hasChildren) {
              html += '<ul>' + renderTree(n.children) + '</ul>';
            }
          } else {
            const star = isFavorite(n.path) ? '<span data-star style="color:var(--accent)">★ </span>' : '';
            html += `<li class="tree-file" data-path="${escapeAttr(n.path)}"><span class="file-label">${star}${escapeHtml(n.name)}</span><span class="open-tab-icon" title="別タブで開く">↗</span></li>`;
          }
        }
        return html;
      }

      function openInNewTab(path) {
        if (!path) return;
        let time = 0;
        if (currentPath === path && video.currentTime > 0) {
          time = Math.floor(video.currentTime);
          video.pause();
        } else {
          const saved = getSavedState();
          if (saved && saved.path === path && saved.time > 0) {
            time = Math.floor(saved.time);
          }
        }
        const tParam = time > 0 ? `&t=${time}` : '';
        const win = window.open(`/player.html?path=${encodeURIComponent(path)}${tParam}`, 'videoPlayer');
        if (win) win.focus();
      }

      function rebindTree() {
        videoTreeEl.querySelectorAll('.tree-folder').forEach((el) => {
          if (el.nextElementSibling?.tagName === 'UL') {
            el.addEventListener('click', () => el.classList.toggle('collapsed'));
          }
        });
        videoTreeEl.querySelectorAll('.tree-file').forEach((el) => {
          el.addEventListener('click', (e) => {
            if (e.target.closest('.open-tab-icon')) return;
            playVideo(el.dataset.path);
          });
        });
        videoTreeEl.querySelectorAll('.open-tab-icon').forEach((el) => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            const path = el.closest('.tree-file')?.dataset.path;
            openInNewTab(path);
          });
        });
      }

      function renderFavSection() {
        const favs = getFavorites().filter((p) => videoList.includes(p));
        favSection.style.display = favs.length === 0 ? 'none' : 'block';
        favList.innerHTML = favs
          .map((p) => {
            const name = p.split('/').pop();
            return `<li class="fav-item" data-path="${escapeAttr(p)}"><span class="file-label">${escapeHtml(name)}</span><span class="open-tab-icon" title="別タブで開く">↗</span></li>`;
          })
          .join('');
        favList.querySelectorAll('.fav-item').forEach((el) => {
          el.addEventListener('click', (e) => {
            if (e.target.closest('.open-tab-icon')) return;
            playVideo(el.dataset.path);
          });
        });
        favList.querySelectorAll('.open-tab-icon').forEach((el) => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            const path = el.closest('.fav-item')?.dataset.path;
            openInNewTab(path);
          });
        });
        setActiveItem(currentPath);
      }

      function updateFavBtn(path) {
        favBtn.textContent = isFavorite(path) ? '★ お気に入り済み' : '☆ お気に入り';
      }

      function refreshTreeStars() {
        videoTreeEl.querySelectorAll('.tree-file').forEach((el) => {
          const label = el.querySelector('.file-label') || el;
          const existing = label.querySelector('span[data-star]');
          if (existing) existing.remove();
          if (isFavorite(el.dataset.path)) {
            const star = document.createElement('span');
            star.dataset.star = '';
            star.style.color = 'var(--accent)';
            star.textContent = '★ ';
            label.prepend(star);
          }
        });
      }

      function escapeAttr(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML.replace(/"/g, '&quot;');
      }

      async function loadVideos() {
        try {
          const res = await fetch('/api/videos');
          if (!res.ok) throw new Error(res.statusText);
          const data = await res.json();
          const tree = data.tree || [];
          lastTree = tree;
          videoList = flattenTree(tree);
          listStatusEl.textContent = '';
          listStatusEl.className = '';

          videoTreeEl.innerHTML = renderTree(tree);
          rebindTree();
          renderFavSection();

          const saved = getSavedState();
          if (saved && videoList.includes(saved.path)) {
            playVideo(saved.path);
          }
        } catch (err) {
          listStatusEl.textContent = '一覧の取得に失敗しました: ' + err.message;
          listStatusEl.className = 'error';
        }
      }

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      // サイドバーのリサイズ機能
      let isResizing = false;

      resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        resizer.classList.add('active');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        const newWidth = e.clientX;
        if (newWidth > 150 && newWidth < 1000) {
          layout.style.gridTemplateColumns = `${newWidth}px 4px 1fr`;
        }
      });

      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          resizer.classList.remove('active');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }
      });

      selectFolderBtn.addEventListener('click', async () => {
        const originalText = selectFolderBtn.textContent;
        selectFolderBtn.textContent = '選択中...';
        selectFolderBtn.disabled = true;

        try {
          const res = await fetch('/api/select-folder', { method: 'POST' });
          const data = await res.json();
          
          if (data.success) {
            // 新しいフォルダが選択されたので動画一覧をリロード
            loadVideos();
            showPlayer(false); // プレイヤーを一旦隠す
          } else if (data.canceled) {
            // キャンセルされた場合は何もしない
          } else {
            alert('エラー: ' + (data.error || 'フォルダ選択に失敗しました'));
          }
        } catch (err) {
          console.error(err);
          alert('通信エラーが発生しました');
        } finally {
          selectFolderBtn.textContent = originalText;
          selectFolderBtn.disabled = false;
        }
      });

      loadVideos();
    </script>
  </body>
</html>
