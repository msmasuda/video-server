<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>動画プレイヤー</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #e8e8ed;
        font-family:
          'SF Pro Text',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .video-container {
        flex: 1;
        width: 100%;
        height: calc(100% - 48px);
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      video {
        width: 100%;
        height: 100%;
        max-width: 100vw;
        max-height: 100%;
        object-fit: contain;
        outline: none;
      }
      .bottom-bar {
        height: 48px;
        background: rgba(18, 18, 22, 0.95);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 0 1rem;
        flex-shrink: 0;
      }
      .btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #d1d1db;
        padding: 0.4rem 0.85rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background 0.15s, color 0.15s;
        user-select: none;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
      }
      .error-msg {
        color: #f87171;
        text-align: center;
        padding: 2rem;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="video-container" id="videoContainer">
      <video
        id="video"
        controls
        autoplay
        muted
        playsinline
        preload="metadata"
        crossorigin="anonymous"
      ></video>
    </div>

    <div class="bottom-bar" id="bottomBar">
      <button class="btn" id="rewind30Btn">⏪ 60秒</button>
      <button class="btn" id="rewind10Btn">⏪ 30秒</button>
      <button class="btn" id="forward10Btn">30秒 ⏩</button>
      <button class="btn" id="forward30Btn">60秒 ⏩</button>
    </div>

    <div class="error-msg" id="errorMsg" style="display: none"></div>

    <script>
      const VIDEO_KEY = 'video-server-current';
      const TIME_KEY = 'video-server-time';

      const params = new URLSearchParams(window.location.search);
      const relativePath = params.get('path');
      const paramTime = params.get('t') !== null ? parseFloat(params.get('t')) : null;

      const video = document.getElementById('video');
      const videoContainer = document.getElementById('videoContainer');
      const bottomBar = document.getElementById('bottomBar');
      const errorMsg = document.getElementById('errorMsg');

      const rewind30Btn = document.getElementById('rewind30Btn');
      const rewind10Btn = document.getElementById('rewind10Btn');
      const forward10Btn = document.getElementById('forward10Btn');
      const forward30Btn = document.getElementById('forward30Btn');

      let saveTimer = null;
      let pendingSave = null;

      function getSavedTime(path) {
        try {
          const raw = localStorage.getItem(VIDEO_KEY);
          const time = localStorage.getItem(TIME_KEY);
          if (raw === path && time !== null) {
            return parseFloat(time) || 0;
          }
        } catch (e) {}
        return 0;
      }

      function saveState(path, time) {
        if (!path) return;
        const safeTime = Math.max(0, typeof time === 'number' && !isNaN(time) ? time : 0);
        try {
          localStorage.setItem(VIDEO_KEY, path);
          localStorage.setItem(TIME_KEY, String(safeTime));
        } catch (e) {}

        pendingSave = { path, time: safeTime };
        if (!saveTimer) {
          saveTimer = setTimeout(() => {
            flushSaveState();
          }, 2000);
        }
      }

      function flushSaveState() {
        if (saveTimer) {
          clearTimeout(saveTimer);
          saveTimer = null;
        }
        if (!pendingSave) return;
        const payload = pendingSave;
        pendingSave = null;

        fetch('/api/playback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true,
        }).catch(() => {});
      }

      async function initPlayer() {
        if (!relativePath) {
          videoContainer.style.display = 'none';
          bottomBar.style.display = 'none';
          errorMsg.style.display = 'block';
          errorMsg.textContent = '動画が指定されていません。一覧画面から動画を選択してください。';
          return;
        }

        const filename = relativePath.split('/').pop();
        document.title = filename;

        const videoUrl = '/video?path=' + encodeURIComponent(relativePath);
        video.src = videoUrl;

        // レジューム位置の計算（クエリパラメータ t があれば最優先、なければ SQLite / localStorage）
        let initialTime = 0;
        if (paramTime !== null && !isNaN(paramTime) && paramTime >= 0) {
          initialTime = paramTime;
        } else {
          try {
            const res = await fetch('/api/playback?path=' + encodeURIComponent(relativePath));
            if (res.ok) {
              const data = await res.json();
              if (data.playback && typeof data.playback.time === 'number' && data.playback.time > 0) {
                initialTime = data.playback.time;
              }
            }
          } catch (e) {}

          if (initialTime === 0) {
            initialTime = getSavedTime(relativePath);
          }
        }

        video.addEventListener(
          'loadedmetadata',
          () => {
            if (initialTime > 0) {
              video.currentTime = initialTime;
            }
          },
          { once: true }
        );

        video.play().catch(() => {});
        saveState(relativePath, initialTime);

        video.addEventListener('timeupdate', () => {
          saveState(relativePath, video.currentTime);
        });

        video.addEventListener('pause', () => {
          saveState(relativePath, video.currentTime);
          flushSaveState();
        });

        video.addEventListener('ended', () => {
          saveState(relativePath, 0);
          flushSaveState();
        });

        window.addEventListener('beforeunload', () => {
          if (video.currentTime > 0) {
            pendingSave = { path: relativePath, time: video.currentTime };
          }
          flushSaveState();
        });

        rewind30Btn.addEventListener('click', () => {
          video.currentTime = Math.max(0, video.currentTime - 60);
        });
        rewind10Btn.addEventListener('click', () => {
          video.currentTime = Math.max(0, video.currentTime - 30);
        });
        forward10Btn.addEventListener('click', () => {
          video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 30);
        });
        forward30Btn.addEventListener('click', () => {
          video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 60);
        });
      }

      initPlayer();
    </script>
  </body>
</html>
